{% extends "auth_base.html" %}
{% block titel %}Inloggen{% endblock %}
{% block inhoud %}
<div>
  <h1>Log in bij doobedoo</h1>
  <p class="uitleg">Beheer de Odoo-koppelingen voor Claude.</p>
</div>
<div class="blok">{% include "_meldingen.html" %}</div>
<form class="formulier" method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next or '' }}">
  <input name="email" type="email" autocomplete="username" placeholder="E-mailadres" aria-label="E-mailadres" required autofocus>
  <input name="password" type="password" autocomplete="current-password" placeholder="Wachtwoord" aria-label="Wachtwoord" required>
  <button class="knop knop--primair knop--groot knop--breed" type="submit">Ga door</button>
</form>
{% endblock %}
