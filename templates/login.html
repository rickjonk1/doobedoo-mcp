{% extends "auth_base.html" %}
{% block titel %}Inloggen{% endblock %}
{% block inhoud %}
<div>
  <h1>Inloggen</h1>
  <p class="lede">Beheer de Odoo-koppelingen van doobedoo.</p>
</div>
{% include "_meldingen.html" %}
<form class="formulier" method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next or '' }}">
  <div class="veld">
    <label for="email">E-mailadres</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
  </div>
  <div class="veld">
    <label for="password">Wachtwoord</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button class="knop knop--groot" type="submit">Doorgaan</button>
</form>
{% endblock %}
