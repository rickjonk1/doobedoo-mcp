{% extends "auth_base.html" %}
{% block titel %}Tweestapsverificatie{% endblock %}
{% block inhoud %}
<div>
  <h1>Tweestapsverificatie</h1>
  <p class="uitleg">Voer de zescijferige code uit je authenticator-app in.</p>
</div>
<div class="blok">
  {% include "_meldingen.html" %}
  {% if error %}<div class="melding melding--fout" role="alert">{{ error }}</div>{% endif %}
</div>
<form class="formulier" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input name="code" type="text" class="code" inputmode="numeric" autocomplete="one-time-code"
         pattern="[0-9]{6}" maxlength="6" data-code aria-label="Code" required autofocus>
  <button class="knop knop--primair knop--groot knop--breed" type="submit">Log in</button>
</form>
<a href="{{ url_for('auth.login') }}">Terug</a>
{% endblock %}
